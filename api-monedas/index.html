<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertidor de monedas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #EEF0E6;
    --tinta: #16241D;
    --verde: #1F4D3A;
    --oro:   #B08D3C;
    --gris:  #6B7A70;
    --linea: #C9CFBF;
    --error: #A33A2B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px;
    display: grid; place-items: center;
    background: var(--papel); color: var(--tinta);
    font-family: "Work Sans", system-ui, sans-serif;
  }
  .billete {
    width: 100%; max-width: 440px; padding: 28px;
    background: #fff; border: 2px solid var(--verde); border-radius: 14px;
    background-image: repeating-radial-gradient(circle at 100% 0, transparent 0 10px, rgba(31,77,58,.05) 10px 11px);
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 1.6rem; margin: 0 0 4px; color: var(--verde);
  }
  .sub { margin: 0 0 24px; color: var(--gris); font-size: .95rem; }
  label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px; font: inherit; font-size: 1rem;
    border: 1px solid var(--linea); border-radius: 8px; background: #fff; color: var(--tinta);
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
  .campo { margin-bottom: 16px; }
  .par {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 10px; align-items: end; margin-bottom: 20px;
  }
  .invertir {
    width: 44px; height: 46px; cursor: pointer; font-size: 1.1rem;
    border: 1px solid var(--linea); border-radius: 8px; background: var(--papel);
  }
  .convertir {
    width: 100%; padding: 14px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--verde); color: #fff; font: inherit; font-weight: 600; font-size: 1rem;
  }
  .convertir:hover { background: #173B2C; }
  .resultado { margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--linea); min-height: 90px; }
  .cifra {
    margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 2.4rem;
    font-variant-numeric: tabular-nums; color: var(--verde); word-break: break-word;
  }
  .detalle { margin: 4px 0 0; color: var(--gris); }
  .error { color: var(--error); }
</style>
</head>
<body>
  <main class="billete">
    <h1>Convertidor de monedas</h1>
    <p class="sub">Tasas aproximadas, con el dólar como base.</p>

    <div class="campo">
      <label for="monto">Monto</label>
      <input id="monto" type="number" min="0" step="0.01" value="100">
    </div>

    <div class="par">
      <div>
        <label for="de">De</label>
        <select id="de"></select>
      </div>
      <button class="invertir" id="invertir" type="button" aria-label="Invertir monedas" title="Invertir">⇄</button>
      <div>
        <label for="a">A</label>
        <select id="a"></select>
      </div>
    </div>

    <button class="convertir" id="convertir" type="button">Convertir</button>

    <section class="resultado" id="resultado" aria-live="polite">
      <p class="detalle">Elige las monedas y el monto.</p>
    </section>
  </main>

<script>
  const de = document.getElementById("de");
  const a = document.getElementById("a");
  const monto = document.getElementById("monto");
  const resultado = document.getElementById("resultado");

  // Llena los dos menús con GET /monedas
  async function cargarMonedas() {
    try {
      const r = await fetch("/monedas");
      const lista = await r.json();
      for (const m of lista) {
        de.add(new Option(`${m.nombre} (${m.codigo})`, m.codigo));
        a.add(new Option(`${m.nombre} (${m.codigo})`, m.codigo));
      }
      de.value = "MXN";
      a.value = "USD";
    } catch (e) {
      mostrarError("No se pudo cargar la lista de monedas. Revisa que el servidor esté corriendo.");
    }
  }

  // Llama a GET /convertir y muestra el resultado
  async function convertir() {
    const valor = monto.value;
    if (valor === "" || Number(valor) < 0) {
      mostrarError("Escribe un monto mayor o igual a 0.");
      return;
    }
    try {
      const url = `/convertir?de=${de.value}&a=${a.value}&monto=${encodeURIComponent(valor)}`;
      const r = await fetch(url);
      const datos = await r.json();
      if (!r.ok) {
        mostrarError(datos.error);
        return;
      }
      resultado.innerHTML = "";
      const detalle = document.createElement("p");
      detalle.className = "detalle";
      detalle.textContent = `${formato(datos.monto)} ${datos.de} =`;
      const cifra = document.createElement("p");
      cifra.className = "cifra";
      cifra.textContent = `${formato(datos.resultado)} ${datos.a}`;
      resultado.append(detalle, cifra);
    } catch (e) {
      mostrarError("No hubo respuesta del servidor. Revisa que siga corriendo.");
    }
  }

  function formato(n) {
    return n.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function mostrarError(texto) {
    resultado.innerHTML = "";
    const p = document.createElement("p");
    p.className = "detalle error";
    p.textContent = texto;
    resultado.append(p);
  }

  document.getElementById("convertir").addEventListener("click", convertir);
  document.getElementById("invertir").addEventListener("click", () => {
    [de.value, a.value] = [a.value, de.value];
    convertir();
  });
  monto.addEventListener("keydown", (e) => { if (e.key === "Enter") convertir(); });

  cargarMonedas();
</script>
</body>
</html>
